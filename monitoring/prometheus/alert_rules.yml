groups:
  - name: sre-lab-alerts
    rules:
      # 서비스 다운 감지
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # 높은 요청 에러율
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 2 minutes."

      # 높은 응답 시간
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is above 1s for 5 minutes."

      # DDoS 의심 트래픽 (Phase 3에서 활용)
      - alert: SuspiciousTraffic
        expr: rate(http_requests_total[1m]) > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate exceeds 100 req/min - possible DDoS attack."
