global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 5s

receivers:
  - name: "default"
    # Phase 2에서 Slack/Discord webhook 연동
    webhook_configs: []

  - name: "critical"
    webhook_configs: []
